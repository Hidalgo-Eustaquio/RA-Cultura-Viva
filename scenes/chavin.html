<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>CHAVÍN</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <script type="text/javascript" src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>

    <style>
        html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;}
        a-scene{position:absolute;top:0;left:0;width:100%;height:100;}

        /* HUD ------------------------------------------------------------- */
        .hud-ui{
            position:absolute;
            left:0;
            right:0;
            pointer-events: auto; /* Permite que los elementos del HUD reciban eventos de puntero */
            z-index: 200; /* Asegura que el HUD esté por encima de la escena AR y el contenedor de modelos */
        }
        #hud-header{top:0;height:50px;background:rgba(0,0,0,.9);color:#fff;
                    text-align:center;line-height:50px;font-size:40px;}
        #hud-back{bottom:15px;left:50%;transform:translateX(-50%);
                    background:#4caf50;color:#fff;padding:12px 16px;font-size:18px;
                    border:2px solid #fff;border-radius:12px;cursor:pointer;text-align:center;}
        .hud-menu{top:60px;display:flex;gap:10px;justify-content:center;}
        .hud-menu button{background:#4caf50;color:#fff;padding:12px 16px;font-size:18px;
                            border:2px solid #fff;border-radius:12px;cursor:pointer;}
        #hud-panel{bottom:70px;left:50%;transform:translateX(-50%);
                    width:90%;max-width:400px;height:250px;background:rgba(0,0,0,.9);
                    color:#fff;padding:10px;box-sizing:border-box;overflow:auto;
                    position:absolute;font-size:28px;text-align:center;
                    border:2px solid #fff;border-radius:12px;
                    /* Crucial: el panel HUD debe estar encima y capturar eventos */
                    z-index:210; /* Mayor que #ar-content-viewer para que HUD tenga prioridad */
                    pointer-events: auto; /* Asegura que el panel capture los eventos */
                }
        .hidden{display:none!important;}

        /* Contenedor principal para los visores 3D (Model Viewer y Sketchfab) */
        #ar-content-viewer {
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            display:flex; /* Para centrar los modelos */
            align-items:center;
            justify-content:center;
            /* Por defecto, no permite interacción, JS lo activará o desactivará */
            pointer-events: none;
            z-index: 100; /* Estará encima de la escena AR (z-index por defecto de A-Frame es 0/1) pero debajo del HUD */
        }
        #ar-content-viewer.hidden{display:none!important;}

        /* visor .glb ------------------------------------------------------- */
        #model-viewer-container{
            width:100%;
            height:100%;
            display:none; /* Oculto por defecto dentro de ar-content-viewer */
            align-items:center;
            justify-content:center;
            pointer-events: auto; /* model-viewer necesita esto para su propio canvas */
        }
        #model-viewer-container.active { display:flex; } /* Clase para activarlo */

        model-viewer{width:100%;height:100%;} /* Ya está dentro de un contenedor con pointer-events:auto */

        .overlay-button{position:absolute;background:rgba(0,0,0,.5);color:#fff;
                        border:2px solid #fff;padding:12px;font-size:18px;cursor:pointer;
                        border-radius:4px;pointer-events:auto;z-index:101;} /* Ligeramente superior al #ar-content-viewer */
        #btn-prev{left:20px;top:50%;transform:translateY(-50%);}
        #btn-next{right:20px;top:50%;transform:translateY(-50%);}

        /* Sketchfab -------------------------------------------------------- */
        #api-frame{
            width:80%;
            height:40%;

            position:absolute;
            top:118px;                      /* 118 px desde el borde superior */
            left:50%;
            transform:translateX(-50%); /* solo centrado horizontal */
            border:2px solid #fff;border-radius:12px;
            display:none;
            pointer-events:auto;          /* mantiene interacción */
        }

        #api-frame.active { display:block; } /* Clase para activarlo */

        /* loader ----------------------------------------------------------- */
        #loader{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
                    background:rgba(0,0,0,.85);color:#fff;padding:12px 24px;font-size:22px;
                    border:2px solid #fff;border-radius:12px;z-index:190;pointer-events:none;}
    </style>
</head>
<body>
    <a-scene vr-mode-ui="enabled:false" loading-screen="enabled:false"
            arjs="sourceType:webcam;debugUIEnabled:false">
        <a-marker preset="hiro" id="hiro-marker"></a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <div id="hud-header" class="hud-ui">CHAVÍN</div>
    <div id="hud-back" class="hud-ui" onclick="location.href='../index.html'">← IR AL MAPA</div>

    <div id="menu-front" class="hud-ui hud-menu">
        <button data-key="ubicacion">Ubicación</button>
        <button data-key="descubridor">Descubridor</button>
        
        <button data-key="economia">Economía</button>
    </div>
    <div id="menu-left"  class="hud-ui hud-menu hidden">
        <button data-key="sociedad">Sociedad</button>
        <button data-key="arquitectura">Arquitectura</button>
    </div>
    <div id="menu-right" class="hud-ui hud-menu hidden">
        <button data-key="escultura">Escultura&nbsp;(3D)</button>
        <button data-key="metalurgia">Metalurgia&nbsp;(3D)</button>
        <button data-key="ceramica">Cerámica&nbsp;(3D)</button>
    </div>

    <div id="hud-panel" class="hud-ui hidden"></div>

    <div id="ar-content-viewer">
        <div id="model-viewer-container">
            <button id="btn-prev" class="overlay-button">◀</button>
            <button id="btn-next" class="overlay-button">▶</button>
            <model-viewer id="mv" camera-controls interaction-prompt="none"
                            exposure="1.2" shadow-intensity="1"></model-viewer>
        </div>

        <iframe id="api-frame" src=""
                sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
                allow="autoplay; fullscreen; xr-spatial-tracking">
        </iframe>
    </div>

    <div id="loader">Cargando…</div>

    <audio src="../assets/audios/intro_chavin.mp3" autoplay></audio>

    <script>
    /* ---------- datos ---------- */
    const CONTENT={
        ubicacion:{audio:'../assets/audios/chavin_ubicacion.mp3',
                    text :'En la cultura Chavín, su centro más importante fue Chavín de Huántar, ubicado en Áncash, en un lugar llamado el Callejón de Conchucos. Allí se juntan los ríos Mosna y Huacheqsa, un valle rodeado de montañas donde vivieron hace miles de años.',
                    embedUid:'cabb014de0564b559cbe7ba084c56b16'},
        descubridor:{audio:'../assets/audios/chavin_descubridor.mp3',
                        text :'El descubridor de la cultura Chavín fue el arqueólogo y médico peruano Julio C. Tello. Él estudió el templo de Chavín de Huántar y dijo que era una de las culturas más antiguas del Perú. Pero mucho antes, en 1548, el cronista Pedro Cieza de León ya había visto el templo. Y en 1620, otro español, Antonio Vásquez de Espinoza, lo visitó y dijo que era tan impresionante que parecía hecho por gigantes. Gracias a Julio C. Tello y a los estudios posteriores, hoy conocemos mucho más sobre esta increíble cultura',
                        models:['../assets/modelos/chavin/descubridor_chavin.glb']},
        sociedad:{audio:'../assets/audios/chavin_sociedad.mp3',
                    video:'../assets/videos/chavin_sociedad.mp4',
                    text :'En la cultura Chavín, la sociedad era teocrática, es decir, gobernada por sacerdotes que decían tener conexión con los dioses. Ellos tenían mucho poder porque conocían el cielo, el clima y los ciclos agrícolas. Gracias a ese conocimiento, podían predecir lluvias o cosechas, lo que hacía que la población confiara en ellos y les ofreciera tributos en forma de alimentos'},
        economia:{audio:'../assets/audios/chavin_economia.mp3',
                    video:'../assets/videos/chavin_economia.mp4',
                    text :'En la cultura Chavín, la economía se basaba en la agricultura y la ganadería.  Uno de sus cultivos más importantes fue el maíz.',
                    models:['../assets/modelos/chavin/economia_chavin.glb']},
        arquitectura:{audio:'../assets/audios/chavin_arquitectura.mp3',
                        text :'En la cultura Chavín, usaban adobe en la costa y piedra en la sierra para construir. Hacían pirámides truncas, templos en forma de herradura o de U, plazas circulares y cuadradas hundidas, y túneles subterráneos que representaban el mundo de abajo, llamado Uku Pacha. Los templos cumplían tres funciones: control social, astronómica y religiosa.',
                        embedUid:'a0fbb78a90704f77974ad03428a3d704'},
        escultura:{audio:'../assets/audios/chavin_escultura.mp3',
                    text :'En la cultura Chavín, sus esculturas eran de piedra y representaban dioses con formas poderosas y misteriosas. Usaban animales como el felino, el ave, la serpiente y el caimán, que eran símbolos de fuerza y respeto. Una de las esculturas más importantes fue el Lanzón Monolítico, una gran figura de más de 4 metros que representa a un dios con cuerpo humano, cara de jaguar y cabello en forma de serpientes. Estaba escondido en el centro del templo, como si protegiera el lugar desde lo profundo. También está la Estela de Raimondi, que muestra a un dios con rasgos de felino, ave y serpiente. Sostiene dos bastones que parecen rayos, por eso lo llamaban el dios de los báculos. El Obelisco Tello representa a un caimán que tiene partes de macho y hembra, lo que simboliza la unión de los opuestos, algo muy importante para los Chavín. Y no olvidemos las Cabezas Clava, esculturas con caras feroces y ojos grandes que estaban colocadas en las paredes del templo. Se cree que servían para proteger el templo y asustar a los enemigos.',
                    models:['../assets/modelos/chavin/escultura/1_lanzon_monolitico.glb', 
                            '../assets/modelos/chavin/escultura/2_estela_raimondi.glb',
                            '../assets/modelos/chavin/escultura/3_obelisco_tello.glb',
                            '../assets/modelos/chavin/escultura/4_cabeza_clava_rn_3347.glb',
                            '../assets/modelos/chavin/escultura/5_cabeza_clava_rn_192986.glb',
                            '../assets/modelos/chavin/escultura/6_cabeza_clava_rn_3349.glb']},
        metalurgia:{audio:'../assets/audios/chavin_metalurgia.mp3',
                    text :'En la cultura Chavín, también trabajaban los metales como el oro. Destacaron por hacer adornos y objetos muy finos. Uno de los más conocidos es el collar de Kunturhuasi, hecho con oro y piedras preciosas. También está el tesoro de Chongoyape, que incluye coronas y collares usados en ceremonias importantes.',
                    models:['../assets/modelos/chavin/metalurgia/1_collar_kunturhuasi.glb', 
                            '../assets/modelos/chavin/metalurgia/2_tesoro_kunturhuasi.glb']},
        ceramica:{audio:'../assets/audios/chavin_ceramica.mp3',
                    text :'En la cultura Chavín, la cerámica era monocroma, es decir, de un solo color, normalmente negro o gris. Tenía forma redonda (globular), base plana y un asa especial llamada asa gollete estribo, con un solo pico. Usaban una técnica llamada incisión, donde dibujaban figuras como felinos sobre la arcilla antes de hornearla.',
                    models:['../assets/modelos/chavin/ceramica/1_botella-204002-chavin.glb', 
                            '../assets/modelos/chavin/ceramica/2_botella-203907-chavin.glb']}
    };

    /* ---------- refs & estado ---------- */
    const panel             = document.getElementById('hud-panel');
    const arContentViewer   = document.getElementById('ar-content-viewer');
    const mvCont            = document.getElementById('model-viewer-container');
    const mv                = document.getElementById('mv');
    const btnPrev           = document.getElementById('btn-prev');
    const btnNext           = document.getElementById('btn-next');
    const apiFrame          = document.getElementById('api-frame');
    const loader            = document.getElementById('loader');

    let currentAudio = null;
    let currentVideo = null; // Referencia para el video actual
    let models = [], idx = 0, lastRegion = null;
    let skfbApi = null, skfbReady = false;

    /**
     * Detiene cualquier audio o video que se esté reproduciendo.
     */
    function stopMedia() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentAudio = null; // Limpiar la referencia
        }
        if (currentVideo) {
            currentVideo.pause();
            currentVideo.currentTime = 0;
            currentVideo.remove(); // Eliminar el elemento de video del DOM
            currentVideo = null; // Limpiar la referencia
        }
        if (skfbApi) {
            skfbApi.pause(); // Pausar Sketchfab si está activo
        }
    }

    /* ---------- helper para (re)dibujar controles ---------- */
    function renderHud(info){
        document.getElementById('panel-content')?.remove();    // limpia

        const wrapper=document.createElement('div');
        wrapper.id='panel-content';

        /* barra superior (ventana) */
        const bar1=document.createElement('div');
        bar1.style.cssText='position:sticky;top:0;display:flex;justify-content:flex-end;gap:5px;'
            +'padding:2px 6px;background:rgba(0,0,0,.8);border-radius:12px;';
        ['−','▢','✖'].forEach(sym=>{
            const b=document.createElement('button'); b.textContent=sym;
            Object.assign(b.style,{background:'none',border:'none',color:'#fff',fontSize:'24px',cursor:'pointer'});
            b.onclick={
                '−':()=>{
                    panel.style.height='100px';
                    panel.style.overflow='hidden';
                    wrapper.style.display='none';
                    // Al minimizar el panel, permitir interacción con el modelo si está activo
                    if (!arContentViewer.classList.contains('hidden')) {
                        arContentViewer.style.pointerEvents = 'auto';
                    }
                },
                '▢':()=>{
                    panel.style.height='250px';
                    panel.style.overflow='auto';
                    wrapper.style.display='block';
                    // Al restaurar el panel, asegurar que solo el panel capture los clics
                    arContentViewer.style.pointerEvents = 'none';
                },
                '✖':()=>{
                    // Llama a la función stopMedia para detener cualquier reproducción
                    stopMedia();
                    panel.classList.add('hidden');
                    // Al cerrar el panel, el contenedor de contenido AR debe estar visible y ser interactuable
                    arContentViewer.classList.remove('hidden'); // Asegura que el contenedor esté visible
                    arContentViewer.style.pointerEvents = 'auto'; // Asegura que el contenedor sea interactuable

                    // Oculta los visores específicos dentro del contenedor si es necesario
                    mvCont.classList.remove('active'); // Oculta .glb
                    apiFrame.classList.remove('active'); // Oculta Sketchfab

                }
            }[sym];
            bar1.appendChild(b);
        });

        /* barra de controles */
        const bar2=document.createElement('div');
        bar2.style.cssText='position:sticky;top:40px;display:flex;justify-content:center;gap:10px;'
            +'padding:4px;background:rgba(0,0,0,.95);border:1px solid #fff;border-radius:12px;flex-wrap:wrap;';

        /* audio */
        if(info.audio){
            stopMedia(); // Detener cualquier medio antes de reproducir uno nuevo
            currentAudio = new Audio(info.audio);
            ['▶','⏸','⏹'].forEach(sym=>{
                const b=document.createElement('button'); b.textContent=sym;
                Object.assign(b.style,{background:'none',border:'none',color:'#fff',fontSize:'26px'});
                b.onclick={'▶':()=>currentAudio.play(),
                            '⏸':()=>currentAudio.pause(),
                            '⏹':()=>{currentAudio.pause();currentAudio.currentTime=0;}}[sym];
                bar2.appendChild(b);
            });
        }

        /* texto */
        if(info.text){
            const bt=document.createElement('button'); bt.textContent='📖';
            Object.assign(bt.style,{background:'none',border:'none',color:'#fff',fontSize:'26px'});
            bt.onclick=()=>{
                document.getElementById('text-block')?.remove();
                // Asegúrate de detener el video si el texto se activa
                if (currentVideo) {
                    currentVideo.pause();
                    currentVideo.remove();
                    currentVideo = null;
                }
                const p=document.createElement('p');
                p.id='text-block'; p.style.marginTop='10px'; p.textContent=info.text;
                wrapper.appendChild(p);
            };
            bar2.appendChild(bt);
        }

        /* video */
        if(info.video){
            const bv=document.createElement('button'); bv.textContent='📹';
            Object.assign(bv.style,{background:'none',border:'none',color:'#fff',fontSize:'26px'});
            bv.onclick=()=>{
                document.getElementById('text-block')?.remove();
                stopMedia(); // Detener cualquier medio antes de reproducir uno nuevo
                const v=document.createElement('video');
                v.id='cur-video'; v.src=info.video; v.controls=true; v.autoplay=true;
                v.style.width='100%'; v.style.marginTop='10px';
                currentVideo = v; // Guardar la referencia al video
                wrapper.appendChild(v);
            };
            bar2.appendChild(bv);
        }

        panel.appendChild(bar1);
        panel.appendChild(bar2);
        panel.appendChild(wrapper);
        panel.scrollTop=0;
    }

    /* ---------- precarga Sketchfab ---------- */
    document.addEventListener('DOMContentLoaded',()=>{
        const client=new Sketchfab(apiFrame);
        client.init(CONTENT.ubicacion.embedUid,{
            autostart:0,ui_controls:0,ui_watermark_link:0,
            success(api){
                skfbApi=api;
                api.addEventListener('viewerready',()=>{
                    skfbReady=true;
                    loader.style.display='none';
                    api.pause();
                    // Por defecto, al precargar, Sketchfab está oculto y no interactuable
                    apiFrame.classList.remove('active'); // Asegurarse de que no esté activo inicialmente
                    arContentViewer.classList.add('hidden'); // Ocultar el contenedor de contenido AR
                    arContentViewer.style.pointerEvents = 'none'; // Desactivar interacción
                });
                api.start();
            },
            error(){console.error('❌ Error precargando Sketchfab');}
        });
    });

    /* ---------- función principal ---------- */
    function showText(key){
        const info=CONTENT[key];

        panel.innerHTML='';
        panel.classList.remove('hidden'); // Muestra el panel
        panel.scrollTop=0;

        stopMedia(); // Detener audio/video al mostrar nuevo contenido

        // Resetear y ocultar todos los visores 3D dentro del contenedor principal
        mvCont.classList.remove('active');
        apiFrame.classList.remove('active');


        // Asegura que el panel HUD capture los clics
        panel.style.pointerEvents = 'auto';
        panel.style.zIndex = '210';

        // Deshabilita la interacción con el contenedor de contenido AR mientras el panel está activo
        arContentViewer.style.pointerEvents = 'none';
        arContentViewer.classList.remove('hidden'); // Asegura que el contenedor esté visible para mostrar el modelo
                                                // (pero no interactuable si el panel está encima)


        /* crea controles inmediatamente */
        renderHud(info);

        /* visor 3D */
        if(info.models){                        // .glb
            models=info.models; idx=0; mv.src=models[0];
            mvCont.classList.add('active'); // Activa el model-viewer específico
        }else if(info.embedUid){                // Sketchfab
            apiFrame.classList.add('active'); // Activa el iframe de Sketchfab específico
            if(skfbReady){
                skfbApi.play(); skfbApi.resize();
            }
            /* vuelve a pintar HUD tras viewerready definitivo */
            const once=()=>{renderHud(info); skfbApi.removeEventListener('viewerready',once);};
            skfbApi.addEventListener('viewerready',once);
        }
    }

    /* navegación modelos .glb */
    btnPrev.onclick=()=>{if(!models.length)return;idx=(idx-1+models.length)%models.length;mv.src=models[idx];};
    btnNext.onclick=()=>{if(!models.length)return;idx=(idx+1)%models.length;mv.src=models[idx];};

    /* botones HUD */
    document.querySelectorAll('.hud-menu button').forEach(btn=>btn.onclick=(e)=>{
        showText(e.target.dataset.key);
    });

    /* menús por rotación */
    const marker = document.querySelector('#hiro-marker');
    const front  = document.getElementById('menu-front');
    const left   = document.getElementById('menu-left');
    const right  = document.getElementById('menu-right');

    function updateMenus(){
        const y=THREE.Math.radToDeg(marker.object3D.rotation.y);
        let region='front'; if(y>45&&y<135)region='left'; else if(y<-45&&y>-135)region='right';

        if(region!==lastRegion){
            // DETENER AUDIO Y VIDEO cuando la región cambia
            stopMedia();

            panel.classList.add('hidden'); // Oculta el panel
            panel.style.pointerEvents = 'none'; // Desactiva los eventos del panel cuando está oculto

            // Cuando se cambia de región, ocultar los modelos y desactivar interacción del contenedor de modelos
            mvCont.classList.remove('active');
            apiFrame.classList.remove('active');
            arContentViewer.classList.add('hidden'); // Oculta el contenedor de modelos
            arContentViewer.style.pointerEvents = 'none'; // Desactiva interacción
        }
        lastRegion=region;
        front.classList.toggle('hidden',region!=='front');
        left .classList.toggle('hidden',region!=='left');
        right.classList.toggle('hidden',region!=='right');

        // Lógica para activar/desactivar la interacción del contenedor de modelos
        // Si el panel está oculto Y (hay un modelo GLB activo O hay un Sketchfab activo)
        const isModelViewerActive = !mvCont.classList.contains('hidden') && mvCont.classList.contains('active');
        const isSketchfabActive = !apiFrame.classList.contains('hidden') && apiFrame.classList.contains('active');

        if (panel.classList.contains('hidden') && (isModelViewerActive || isSketchfabActive)) {
            arContentViewer.style.pointerEvents = 'auto'; // Permite interacción con el contenedor de modelos
        } else {
            arContentViewer.style.pointerEvents = 'none'; // Desactiva interacción (HUD activo o no hay modelo)
        }
    }
    (function tick(){if(marker.object3D)updateMenus();requestAnimationFrame(tick);})();
    </script>
</body>
</html>
