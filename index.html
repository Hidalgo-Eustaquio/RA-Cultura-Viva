<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>RA Cultura Viva</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      /* Splash screen */
      #splash {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: #5eaeeb;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      #splash img {
        max-width: 80%;
        max-height: 80%;
      }
      #splash.fade-out {
        animation: fadeOut 2s forwards;
      }
      @keyframes fadeOut {
        to { opacity: 0; visibility: hidden; }
      }

      /* Botón leer libro */
      #readButton {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 9998;
        font-size: 24px;
        background-color: rgba(255,255,255,0.8);
        border: none;
        border-radius: 8px;
        padding: 10px;
        cursor: pointer;
      }

      /* Texto del audio */
      #audioText {
        position: fixed;
        bottom: 70px;
        left: 20px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 12px 16px;
        border-radius: 8px;
        max-width: 320px;
        display: none;
        z-index: 9998;
        font-size: 15px;
        line-height: 1.4;
      }

      #closeText {
        position: absolute;
        top: 4px;
        right: 6px;
        background: none;
        border: none;
        color: white;
        font-size: 18px;
        cursor: pointer;
      }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <!-- Splash screen -->
    <div id="splash">
      <img src="assets/imagenes/splash.png" alt="Cultura Viva">
    </div>

    <!-- Botón leer -->
    <button id="readButton">📖</button>

    <!-- Texto del audio -->
    <div id="audioText">
      <button id="closeText">✖</button>
      ¡Bienvenido a Cultura Viva!
      Descubre las culturas ancestrales del Perú a través de la Realidad Aumentada. Utiliza el punto de enfoque para seleccionar los botones en el mapa y comenzar tu experiencia.
    </div>

    <a-scene embedded arjs="sourceType: webcam;">
      <a-assets>
        <a-asset-item id="modeloMapa" src="assets/modelos/mapa_peru.glb"></a-asset-item>
        <audio id="audioIntro" src="assets/audios/intro_mapa.mp3" preload="auto"></audio>
      </a-assets>

      <a-marker preset="hiro">
        <a-entity gltf-model="#modeloMapa" position="-0.5 -4 -2.1" scale="0.5 0.5 0.5" pinch-to-zoom mousewheel-zoom></a-entity>

        <!-- CHAVIN -->
        <a-box class="clickable" position="-0.6 -3.9 -1.5" depth="0.4" height="0.4" width="0.7" color="#33FF57"
               onclick="location.href='scenes/chavin.html'"></a-box>
        <a-text value="CHAVIN" position="-0.6 -3.5 -1.5" align="center" color="red"
                font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" scale="0.7 0.7 0.7" rotation="-45 0 0"></a-text>

        <!-- CARAL -->
        <a-box class="clickable" position="-0.3 -3.9 -1" depth="0.4" height="0.4" width="0.7" color="#FF5733"
               onclick="location.href='scenes/caral.html'"></a-box>
        <a-text value="CARAL" position="-0.3 -3.5 -1" align="center" color="blue"
                font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" scale="0.7 0.7 0.7" rotation="-45 0 0"></a-text>

        <!-- NAZCA -->
        <a-box class="clickable" position="0 -3.9 -0.5" depth="0.4" height="0.4" width="0.7" color="#3357FF"
               onclick="location.href='scenes/nazca.html'"></a-box>
        <a-text value="NAZCA" position="0 -3.5 -0.5" align="center" color="red"
                font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" scale="0.7 0.7 0.7" rotation="-45 0 0"></a-text>
      </a-marker>

      <a-entity camera>
        <a-cursor raycaster="objects: .clickable" fuse="false"></a-cursor>
      </a-entity>
    </a-scene>

    <script>
      // Splash + audio
      window.addEventListener('load', () => {
        const splash = document.getElementById('splash');
        const audio = document.getElementById('audioIntro');

        setTimeout(() => {
          splash.classList.add('fade-out');
          audio.play().catch(() => console.warn("No se pudo reproducir el audio automáticamente."));
        }, 2500);

        splash.addEventListener('click', () => splash.classList.add('fade-out'));
      });

      // Mostrar/ocultar texto
      const readBtn = document.getElementById('readButton');
      const audioText = document.getElementById('audioText');
      const closeBtn = document.getElementById('closeText');

      readBtn.onclick = () => {
        audioText.style.display = audioText.style.display === 'block' ? 'none' : 'block';
      };
      closeBtn.onclick = () => {
        audioText.style.display = 'none';
      };

      // Zoom táctil
      AFRAME.registerComponent('pinch-to-zoom', {
        schema: { min: { default: 0.5 }, max: { default: 3 } },
        init: function () {
          const el = this.el;
          let initDist, initScale = el.object3D.scale.x;
          this.el.sceneEl.canvas.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
              const dx = e.touches[0].clientX - e.touches[1].clientX;
              const dy = e.touches[0].clientY - e.touches[1].clientY;
              initDist = Math.hypot(dx, dy);
              initScale = el.object3D.scale.x;
            }
          });
          this.el.sceneEl.canvas.addEventListener('touchmove', e => {
            if (e.touches.length === 2 && initDist) {
              const dx = e.touches[0].clientX - e.touches[1].clientX;
              const dy = e.touches[0].clientY - e.touches[1].clientY;
              let factor = Math.hypot(dx, dy) / initDist;
              factor = Math.max(this.data.min / initScale, Math.min(this.data.max / initScale, factor));
              el.object3D.scale.setScalar(initScale * factor);
            }
          });
        }
      });

      // Zoom con mouse
      AFRAME.registerComponent('mousewheel-zoom', {
        schema: { min: { default: 0.5 }, max: { default: 3 }, sensitivity: { default: 0.05 } },
        init: function () {
          const el = this.el;
          window.addEventListener('wheel', e => {
            let scale = el.object3D.scale.x;
            const delta = e.deltaY > 0 ? -this.data.sensitivity : this.data.sensitivity;
            scale = Math.max(this.data.min, Math.min(this.data.max, scale + delta));
            el.object3D.scale.set(scale, scale, scale);
          });
        }
      });
    </script>
  </body>
</html>
